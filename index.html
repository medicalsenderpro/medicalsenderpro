<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MedicalSenderPro</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: url("https://images.unsplash.com/photo-1581091870622-2f0b7b0b5c0f") no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(0,0,0,0.65);
      min-height: 100vh;
      padding: 30px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 26px;
    }

    .btn {
      background: #38bdf8;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .center {
      text-align: center;
      margin-top: 120px;
    }

    .title {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 18px;
      color: #cbd5e1;
    }

    .contact {
      margin-top: 120px;
      text-align: center;
      font-size: 16px;
      color: #e2e8f0;
    }

    .arabic {
      direction: rtl;
      text-align: right;
    }

  </style>
</head>

<body>

<div class="overlay">

  <header>
    <h1>MedicalSenderPro</h1>
    <button class="btn" onclick="toggleLang()">AR / EN</button>
  </header>

  <div class="center">
    <div class="title" id="title">Secure Medical DICOM Sharing</div>
    <div class="desc" id="desc">Fast and safe platform for radiology centers</div>
  </div>

  <div class="contact">
    <p id="contact">Contact: medicalsenderpro@gmail.com</p>
    <p>www.medicalsenderpro.com</p>
  </div>

</div>

<script>
  let arabic = false;

  function toggleLang() {
    arabic = !arabic;

    if (arabic) {
      document.body.classList.add("arabic");

      document.getElementById("title").innerText =
        "منصة آمنة لتبادل ملفات الأشعة";

      document.getElementById("desc").innerText =
        "حل سريع وآمن لمراكز الأشعة";

      document.getElementById("contact").innerText =
        "تواصل معنا: medicalsenderpro@gmail.com";

    } else {
      document.body.classList.remove("arabic");

      document.getElementById("title").innerText =
        "Secure Medical DICOM Sharing";

      document.getElementById("desc").innerText =
        "Fast and safe platform for radiology centers";

      document.getElementById("contact").innerText =
        "Contact: medicalsenderpro@gmail.com";
    }
  }
</script>

</body>
</html>
