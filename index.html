<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MedicalSenderPro</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: url("https://images.unsplash.com/photo-1581091870622-2f0b7b0b5c0f") no-repeat center center fixed;
    background-size: cover;
  }

  .overlay {
    background: rgba(0,0,0,0.65);
    min-height: 100vh;
    padding: 25px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  h1 {
    color: #38bdf8;
    margin: 0;
  }

  .btn {
    background: #38bdf8;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }

  .hero {
    text-align: center;
    margin-top: 120px;
  }

  .hero h2 {
    font-size: 40px;
  }

  .section {
    text-align: center;
    margin-top: 80px;
  }

  .card {
    background: rgba(255,255,255,0.08);
    padding: 20px;
    border-radius: 12px;
    max-width: 600px;
    margin: 20px auto;
  }

  .contact {
    margin-top: 80px;
    text-align: center;
    color: #e2e8f0;
  }

  .arabic {
    direction: rtl;
    text-align: right;
  }

</style>
</head>

<body>

<div class="overlay">

  <header>
    <h1>MedicalSenderPro</h1>
    <button class="btn" onclick="toggleLang()">AR / EN</button>
  </header>

  <div class="hero">
    <h2 id="title">Secure Medical DICOM Sharing</h2>
    <p id="desc">Fast and safe platform for radiology centers</p>
  </div>

  <div class="section">
    <div class="card">
      <h3 id="featureTitle">Why MedicalSenderPro?</h3>
      <p id="featureText">
        A secure system designed for radiology departments to send and receive medical imaging safely.
      </p>
    </div>
  </div>

  <div class="contact">
    <p id="contact">Contact: medicalsenderpro@gmail.com</p>
    <p>www.medicalsenderpro.com</p>
  </div>

</div>

<script>
let arabic = false;

function toggleLang() {
  arabic = !arabic;

  if (arabic) {
    document.body.classList.add("arabic");

    document.getElementById("title").innerText =
      "منصة آمنة لتبادل ملفات الأشعة";

    document.getElementById("desc").innerText =
      "حل سريع وآمن لمراكز الأشعة";

    document.getElementById("featureTitle").innerText =
      "لماذا MedicalSenderPro؟";

    document.getElementById("featureText").innerText =
      "نظام آمن مصمم لمراكز الأشعة لتبادل الصور الطبية.";

    document.getElementById("contact").innerText =
      "تواصل معنا: medicalsenderpro@gmail.com";

  } else {
    document.body.classList.remove("arabic");

    document.getElementById("title").innerText =
      "Secure Medical DICOM Sharing";

    document.getElementById("desc").innerText =
      "Fast and safe platform for radiology centers";

    document.getElementById("featureTitle").innerText =
      "Why MedicalSenderPro?";

    document.getElementById("featureText").innerText =
      "A secure system designed for radiology departments to send and receive medical imaging safely.";

    document.getElementById("contact").innerText =
      "Contact: medicalsenderpro@gmail.com";
  }
}
</script>

</body>
</html>
