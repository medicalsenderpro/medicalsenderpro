<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MedicalSenderPro</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: url("https://images.unsplash.com/photo-1581091870622-2f0b7b0b5c0f") no-repeat center center fixed;
    background-size: cover;
  }

  .overlay {
    background: rgba(0,0,0,0.70);
    min-height: 100vh;
  }

  /* NAVBAR */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
  }

  nav h1 {
    color: #38bdf8;
    margin: 0;
    font-size: 20px;
  }

  nav a {
    color: white;
    margin: 0 10px;
    text-decoration: none;
    font-weight: bold;
  }

  nav a:hover {
    color: #38bdf8;
  }

  .btn {
    background: #38bdf8;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }

  /* SECTIONS */
  section {
    padding: 100px 20px;
    text-align: center;
  }

  .hero h2 {
    font-size: 42px;
    margin-bottom: 10px;
  }

  .card {
    background: rgba(255,255,255,0.08);
    padding: 25px;
    border-radius: 12px;
    max-width: 600px;
    margin: auto;
  }

  .contact {
    color: #e2e8f0;
  }

  .arabic {
    direction: rtl;
    text-align: right;
  }

</style>
</head>

<body>

<div class="overlay">

<!-- NAVBAR -->
<nav>
  <h1>MedicalSenderPro</h1>

  <div>
    <a href="#home">Home</a>
    <a href="#features">Features</a>
    <a href="#contact">Contact</a>
    <button class="btn" onclick="toggleLang()">AR / EN</button>
  </div>
</nav>

<!-- HERO -->
<section id="home" class="hero">
  <h2 id="title">Secure Medical DICOM Sharing</h2>
  <p id="desc">Fast and safe platform for radiology centers</p>
</section>

<!-- FEATURES -->
<section id="features">
  <div class="card">
    <h3 id="featureTitle">Why MedicalSenderPro?</h3>
    <p id="featureText">
      A secure system designed for radiology departments to send and receive medical imaging safely.
    </p>
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="contact">
  <p id="contactText">Contact: medicalsenderpro@gmail.com</p>
  <p>www.medicalsenderpro.com</p>
</section>

</div>

<script>
let arabic = false;

function toggleLang() {
  arabic = !arabic;

  if (arabic) {
    document.body.classList.add("arabic");

    document.getElementById("title").innerText =
      "منصة آمنة لتبادل ملفات الأشعة";

    document.getElementById("desc").innerText =
      "حل سريع وآمن لمراكز الأشعة";

    document.getElementById("featureTitle").innerText =
      "لماذا MedicalSenderPro؟";

    document.getElementById("featureText").innerText =
      "نظام آمن لمراكز الأشعة لتبادل الصور الطبية.";

    document.getElementById("contactText").innerText =
      "تواصل معنا: medicalsenderpro@gmail.com";

  } else {
    document.body.classList.remove("arabic");

    document.getElementById("title").innerText =
      "Secure Medical DICOM Sharing";

    document.getElementById("desc").innerText =
      "Fast and safe platform for radiology centers";

    document.getElementById("featureTitle").innerText =
      "Why MedicalSenderPro?";

    document.getElementById("featureText").innerText =
      "A secure system designed for radiology departments to send and receive medical imaging safely.";

    document.getElementById("contactText").innerText =
      "Contact: medicalsenderpro@gmail.com";
  }
}
</script>

</body>
</html>
