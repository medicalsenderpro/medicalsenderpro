<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MedicalSenderPro</title>

<!-- simple icon support -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #0f172a;
}

/* HERO BACKGROUND IMAGE (SUBTLE) */
.hero {
  text-align: center;
  padding: 110px 20px;
  background: url("https://images.unsplash.com/photo-1581091870622-2f0b7b0b5c0f") center/cover no-repeat;
  position: relative;
  color: white;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-size: 42px;
  margin: 0;
}

.hero p {
  font-size: 18px;
  color: #e2e8f0;
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 25px;
  border-bottom: 1px solid #e2e8f0;
  position: sticky;
  top: 0;
  background: white;
}

nav h2 {
  margin: 0;
  color: #0ea5e9;
}

nav a {
  margin: 0 10px;
  text-decoration: none;
  color: #334155;
  font-weight: 600;
}

/* SECTIONS */
.section {
  padding: 70px 20px;
  text-align: center;
}

.card {
  max-width: 700px;
  margin: auto;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  padding: 25px;
  border-radius: 12px;
}

/* ICONS */
.features {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.feature {
  width: 220px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  padding: 20px;
  border-radius: 12px;
}

.feature i {
  font-size: 28px;
  color: #0ea5e9;
  margin-bottom: 10px;
}

/* CONTACT */
.contact {
  background: #f8fafc;
  border-top: 1px solid #e2e8f0;
  text-align: center;
  padding: 40px 20px;
}

/* BUTTON */
.btn {
  background: #0ea5e9;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

/* ARABIC */
.arabic {
  direction: rtl;
  text-align: right;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
  <h2>MedicalSenderPro</h2>

  <div>
    <a href="#home">Home</a>
    <a href="#features">Features</a>
    <a href="#contact">Contact</a>
    <button class="btn" onclick="toggleLang()">AR / EN</button>
  </div>
</nav>

<!-- HERO -->
<div class="hero" id="home">
  <div class="hero-content">
    <h1 id="title">Secure Medical DICOM Sharing</h1>
    <p id="desc">Fast and safe platform for radiology centers</p>
  </div>
</div>

<!-- FEATURES -->
<div class="section" id="features">
  <h2>Why MedicalSenderPro?</h2>

  <div class="features">

    <div class="feature">
      <i class="fa-solid fa-shield-halved"></i>
      <p>Secure Transfer</p>
    </div>

    <div class="feature">
      <i class="fa-solid fa-bolt"></i>
      <p>Fast Sharing</p>
    </div>

    <div class="feature">
      <i class="fa-solid fa-hospital"></i>
      <p>Radiology Focused</p>
    </div>

  </div>
</div>

<!-- CONTACT -->
<div class="contact" id="contact">
  <p id="contactText">Contact: medicalsenderpro@gmail.com</p>
  <p>www.medicalsenderpro.com</p>
</div>

<script>
let arabic = false;

function toggleLang() {
  arabic = !arabic;

  if (arabic) {
    document.body.classList.add("arabic");

    document.getElementById("title").innerText =
      "منصة آمنة لتبادل ملفات الأشعة";

    document.getElementById("desc").innerText =
      "حل سريع وآمن لمراكز الأشعة";

    document.getElementById("contactText").innerText =
      "تواصل معنا: medicalsenderpro@gmail.com";

  } else {
    document.body.classList.remove("arabic");

    document.getElementById("title").innerText =
      "Secure Medical DICOM Sharing";

    document.getElementById("desc").innerText =
      "Fast and safe platform for radiology centers";

    document.getElementById("contactText").innerText =
      "Contact: medicalsenderpro@gmail.com";
  }
}
</script>

</body>
</html>
