<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MedicalSenderPro</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: url("https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc") no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(0,0,0,0.7);
      min-height: 100vh;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: #38bdf8;
      margin: 0;
    }

    .lang-btn {
      background: #38bdf8;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h2 {
      font-size: 40px;
    }

    .section {
      max-width: 600px;
      margin: auto;
      padding: 40px 20px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
    }

    button {
      background: #38bdf8;
      border: none;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
      border-radius: 6px;
    }

    .arabic {
      direction: rtl;
      text-align: right;
    }

  </style>
</head>

<body>

<div class="overlay">

  <header>
    <h1>MedicalSenderPro</h1>
    <button class="lang-btn" onclick="toggleLang()">AR / EN</button>
  </header>

  <div class="hero">
    <h2 id="title">Secure Medical DICOM Sharing</h2>
    <p id="desc">Fast and safe platform for radiology centers</p>
  </div>

  <div class="section">
    <h3 id="contactTitle">Contact Us</h3>

    <form onsubmit="sendMessage(event)">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" placeholder="Your Message" rows="4"></textarea>
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

</div>

<script>
  let arabic = false;

  function toggleLang() {
    arabic = !arabic;

    if (arabic) {
      document.body.classList.add("arabic");

      document.getElementById("title").innerText = "منصة آمنة لتبادل ملفات الأشعة";
      document.getElementById("desc").innerText = "حل سريع وآمن لمراكز الأشعة";
      document.getElementById("contactTitle").innerText = "تواصل معنا";
      document.getElementById("sendBtn").innerText = "إرسال";

      document.getElementById("name").placeholder = "الاسم";
      document.getElementById("email").placeholder = "البريد الإلكتروني";
      document.getElementById("message").placeholder = "رسالتك";
    } else {
      document.body.classList.remove("arabic");

      document.getElementById("title").innerText = "Secure Medical DICOM Sharing";
      document.getElementById("desc").innerText = "Fast and safe platform for radiology centers";
      document.getElementById("contactTitle").innerText = "Contact Us";
      document.getElementById("sendBtn").innerText = "Send";

      document.getElementById("name").placeholder = "Your Name";
      document.getElementById("email").placeholder = "Your Email";
      document.getElementById("message").placeholder = "Your Message";
    }
  }

  function sendMessage(e) {
    e.preventDefault();
    alert("Message sent! (Firebase connection will come next)");
  }
</script>

</body>
</html>
